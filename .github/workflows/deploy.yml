# Builds the site and publishes it to GitHub Pages whenever the repository's
# default branch changes (whatever that branch is called).
#
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
# (With the other option, "Deploy from a branch", GitHub runs Jekyll over the
# source files and fails on the .astro components.)
#
# The site is served at https://<user>.github.io/<repo>/ unless you add a
# custom domain, in which case set SITE_URL to that domain and BASE_PATH to /.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
