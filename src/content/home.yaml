metaDescription: >-
  Pakawat (Messi) Poldetch, a Grade 11 student in Bangkok interested in how
  complex systems work and how understanding them can become useful.

opening:
  eyebrow: Grade 11 · Ruamrudee International School · Bangkok · Class of 2028
  theme: Understanding complexity. Making knowledge useful.
  intro: |
    I'm a student in Bangkok interested in how complex systems work, and in how
    understanding them can become useful. My work runs from aquaculture
    research and a decision-support tool for shrimp farmers to neuroscience,
    economics, and a developing healthcare project. History, philosophy, and
    music give me other ways to think about relationships, decisions, and
    meaning.
