question:
  quote: How can understanding a system help us make better decisions within it?
  body: |
    This question runs under most of what I do. A shrimp pond, a fly's visual
    circuit, a market, and a rural clinic are all made of parts whose
    relationships matter more than any single piece. I want to understand those
    relationships well enough to act on them, and to know the limits of that
    understanding when I do.
  href: /about
  linkLabel: More about how I think
