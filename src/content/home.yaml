  eyebrow: Grade 11 · Ruamrudee International School · Bangkok · Class of 2028
  heading: Understanding complexity. Making knowledge useful.
  intro: |
    I'm Pakawat, usually called Messi, a student in Bangkok interested in how
    complex systems work, and in how understanding them can become useful. My
    work ranges from aquaculture research and a decision-support tool for shrimp
    farmers to neuroscience, economics, and a developing healthcare project.
    History, philosophy, and music give me other ways to think about
    relationships, decisions, and meaning.
