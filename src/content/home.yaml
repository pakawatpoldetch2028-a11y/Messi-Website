threads:
  heading: Three threads, one question
  intro: >-
    Most of what I do fits one of three habits. Together they ask how
    understanding a system can help us make better decisions within it.
  items:
    - title: Investigating biological systems
      body: >-
        With the Faculty of Fisheries at Kasetsart University, I have
        contributed to studies of shrimp health and nutrition, and I am now
        working on questions about antibiotics and antimicrobial resistance in
        aquaculture. In neuroscience, I studied how the wiring of a single
        neuron in the fly visual system relates to what it does.
      href: /work/aquaculture-research
      linkLabel: Aquaculture research
    - title: Building tools that make knowledge usable
      body: >-
        ShrimpPulse turns specialised knowledge about disease, water quality,
        and the responsible use of antimicrobials into answers a farmer can act
        on. Telesync, a telemedicine project I contribute to, aims to bring
        care closer to patients and providers in rural Thailand.
      href: /work/shrimppulse
      linkLabel: ShrimpPulse
    - title: Exploring the human context of decisions
      body: >-
        Economics taught me to ask about incentives and trade-offs. History and
        philosophy ask harder questions: which institutions shape outcomes,
        what follows from a decision, and what we ought to value. I compete in
        all three, and they change how I think about the work above.
      href: /beyond
      linkLabel: Beyond the lab

