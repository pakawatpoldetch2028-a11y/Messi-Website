# ---------------------------------------------------------------------------
# Milestones: high-school accomplishments, grouped by discipline.
#
# Fields
#   id            unique, used for links such as /milestones#ieo-2026-bronze
#   group         economics | philosophy | history | neuroscience | speaking |
#                 recognition | music
#   date          "2026", "2026-01" or "2026-01-15" (as precise as you know)
#   dateLabel     optional text shown instead of the formatted date
#   outcome       the result, e.g. "Bronze medal"
#   organisation  who awarded it
#   description   a sentence or two (markdown)
#   details       optional bullet list
#   href          link to a project page, a Beyond the Lab section, or a URL
#   image         optional certificate or photograph (src inside src/assets/images)
#   featured      true to allow it on the home page (home.yaml picks by id)
#   published     set false to keep an entry private until confirmed
# ---------------------------------------------------------------------------

