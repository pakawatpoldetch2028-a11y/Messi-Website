metaDescription: >-
  An intellectual portrait of Pakawat (Messi) Poldetch: biology and
  neuroscience, quantitative thinking, economics, history, philosophy, and
  music, and the questions that connect them.

heading: About

portrait:
  src: portraits/messi-portrait.jpg
  alt: Pakawat (Messi) Poldetch in a white school polo shirt, photographed indoors.
  position: 50% 25%
  ratio: '3/4'
  placeholder: Portrait

opening: |
  I live in Bangkok and am in Grade 11 at Ruamrudee International School, Class
  of 2028. The simplest way to describe what interests me is that I like to
  understand how things work at the level of their parts, and then ask what that
  understanding is good for.

  That instinct shows up in different places. In biology, it is the question of
  how cells, pathogens, and environments interact to produce health or disease.
  In neuroscience, it is the question of how the wiring of a circuit relates to
  what it computes. In economics, it is the question of how incentives shape
  what people and institutions actually do. In history and philosophy, it is the
  question of how we interpret what happened, and what we should value when we
  decide what to do next.

interests:
  heading: Where my interests sit
  items:
    - title: Biology and neuroscience
      body: |
        Most of my research so far has been in aquatic animal health, with the
        Faculty of Fisheries at Kasetsart University. Shrimp farming is a system
        where biology, economics, and regulation meet: a disease outbreak is a
        scientific problem, a financial one, and often a question about how
        antibiotics are used. My current research direction is antimicrobial
        resistance in aquaculture.

        Neuroscience is the other side of the same interest. I am drawn to
        connectomics, the study of complete wiring diagrams, because it asks a
        very direct version of my central question: given the structure of a
        system, what does it do?
    - title: Quantitative thinking
      body: |
        Mathematics is how I make my questions precise. I take Mathematics
        Analysis and Approaches at Higher Level, and I find that the habit of
        defining things carefully carries over into biology and economics, where
        a vague question usually hides a measurable one.
    - title: Economics, history, and philosophy
      body: |
        Economics gives me a language for incentives, trade-offs, and policy. I
        compete in economics olympiads, and I have recently become interested in
        climate economics, particularly carbon-border policy and what it means
        for exporting countries like Thailand.

        History and philosophy keep me honest. History shows how institutions
        and consequences unfold over time, and how much depends on
        interpretation. Philosophy forces me to say what I actually mean, and
        whether the claim holds.
    - title: Music
      body: |
        I play classical guitar and clarinet, and have studied both for many
        years. I keep playing because I enjoy it. It does not need to connect to
        anything else, and I prefer that it does not.

