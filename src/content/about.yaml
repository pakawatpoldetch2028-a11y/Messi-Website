metaDescription: >-
  An intellectual portrait of Pakawat (Messi) Poldetch: biology and
  neuroscience, quantitative thinking, economics, history, philosophy, and
  music, and the questions that connect them.

heading: About

portrait:
  src: portraits/messi-portrait.jpg
  alt: Pakawat (Messi) Poldetch in a white school polo shirt, photographed indoors.
  position: 50% 25%
  ratio: '3/4'
  placeholder: Portrait

opening: |
  I live in Bangkok and am in Grade 11 at Ruamrudee International School, Class
  of 2028. The simplest way to describe what interests me is that I like to
  understand how things work at the level of their parts, and then ask what that
  understanding is good for.

  That instinct shows up in different places. In biology, it is the question of
  how cells, pathogens, and environments interact to produce health or disease.
  In neuroscience, it is the question of how the wiring of a circuit relates to
  what it computes. In economics, it is the question of how incentives shape
  what people and institutions actually do. In history and philosophy, it is the
  question of how we interpret what happened, and what we should value when we
  decide what to do next.

