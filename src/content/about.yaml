questions:
  heading: Questions I'm exploring
  intro: >-
    These are the questions I keep returning to. The projects on this site are
    attempts at partial answers.
  items:
    - How do interactions between biological components produce complex behaviour?
    - What makes scientific knowledge usable outside a laboratory?
    - How do incentives and institutions influence the adoption of useful technologies?
    - When a decision has to be made with incomplete knowledge, what does it mean to make it well?

directions:
  heading: Where I would like to go next
  body: |
    I would like to study biomedicine, biomedical engineering, or neuroscience,
    and I am still working out how those fit together. What I do know is the
    shape of the work I want to do: understanding a biological system carefully
    enough that the understanding changes a decision, whether that decision
    belongs to a farmer, a clinician, or a patient.

    The projects on this site are my first attempts at that. I expect the next
    ones to be harder, and I would like to be somewhere that takes the questions
    seriously.

