title: ShrimpPulse
area: Decision-support software for shrimp farmers
summary: >-
  A chatbot that gives Thai shrimp farmers practical, accessible answers about
  disease, water quality, biosecurity, nutrition, and the appropriate use of
  antimicrobials and chemicals.
order: 2
published: true
status:
  label: Publicly released · version 4.0 in development
  tone: active
period: 2025 – present
role: Creator and developer

