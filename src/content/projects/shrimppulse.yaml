intro: |
  ShrimpPulse is a chatbot for Thai shrimp farmers. A farmer can describe what
  they are seeing in a pond, in plain language, and get an answer grounded in
  scientific and regulatory knowledge: what the signs might indicate, which
  water-quality parameters to check, which treatments are appropriate and which
  are not permitted, and when to seek expert help.

steps:
  - key: question
    title: The problem
    body: |
      The knowledge that would help a shrimp farmer make a better decision
      mostly exists already. It is in research papers, in regulatory guidance on
      antimicrobial and chemical use, in water-quality standards, and in the
      experience of fisheries scientists. The problem is distance. That
      knowledge is scattered, often technical, and rarely available at nine in
      the evening when a pond looks wrong and a decision cannot wait.

      Could a tool close that gap, and do it carefully enough that it helps
      rather than adds to the noise?
  - key: approach
    title: Approach
    body: |
      ShrimpPulse draws on a curated body of specialised knowledge covering
      disease, appropriate antimicrobial and chemical use, water quality,
      biosecurity, nutrition, and farm management. It is designed to answer in
      everyday language, to say what to check rather than only what might be
      wrong, to be explicit about which substances are permitted, and to point
      towards a specialist when a question is beyond what a chatbot should
      answer.

      The project has moved through several versions. Each one was shaped by
      what happened when real farmers used the previous one.
  - key: contribution
    title: My contribution
    body: |
      ShrimpPulse is my project. I started it and have led its development
      through each version, drawing on what I learned from aquaculture research
      at Kasetsart University to decide what the tool should know and how
      cautious it should be.
  - key: evidence
    title: Evidence and status
    body: |
      ShrimpPulse is publicly released and in use, and a feedback form has been
      collecting responses from users since September 2026. The timeline
      records what has actually happened.

      What I am not claiming: releasing a tool does not prove that it changes
      how farmers use antimicrobials, and I have not measured that. Any
      statement about impact belongs after the evidence, not before it.
  - key: next
    title: The next question
    body: |
      The hardest problem turned out not to be technical. Why does one farmer
      act on advice while another ignores it? That is a question about
      incentives, trust, and institutions as much as about biology, and it is
      where my interest in [economics](/beyond#economics) meets this project.

