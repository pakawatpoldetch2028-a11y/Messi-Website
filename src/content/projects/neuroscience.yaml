intro: |
  A connectome is a wiring diagram: a map of every neuron in a brain and every
  connection between them. For the fruit fly, that map now exists. My report
  looked at one neuron inside it, H1, and asked what its connections can tell
  us about what it does.

steps:
  - key: question
    title: The question
    body: |
      H1 is one of the best-studied neurons in the fly's visual system. It
      responds to wide-field horizontal motion, the kind of visual flow a fly
      experiences when it turns, and decades of electrophysiology describe its
      behaviour in detail. The connectome adds something different: it shows
      what H1 is connected to.

      The question I set myself was whether structure can explain function. If
      you know a neuron's inputs and outputs, how much of its role can you
      read directly from the wiring, and where does the wiring alone fall
      short?
  - key: approach
    title: Approach
    body: |
      The report examines H1's place in the fly visual circuit, drawing on the
      published fly connectome data and on the physiological literature that
      describes what H1 computes. It sets the two side by side: what the
      anatomy suggests, what the physiology shows, and where they agree or
      leave questions open.

      What appeals to me about connectomics is how literal it makes the
      question. A circuit is a set of parts and relationships. If understanding
      the relationships explains the behaviour, that is my central question
      answered in miniature.
  - key: contribution
    title: My contribution
    body: |
      I researched and wrote the report as my entry to the High School
      Category of the 2025 Fly Connectome Research Competition.
  - key: evidence
    title: Evidence and status
    body: |
      The report won the High School Category of the 2025 Fly Connectome
      Research Competition, announced in 2026. The award supports the work; the
      work itself is in the report, an excerpt of which will appear on this
      page once I add it.
  - key: next
    title: The next question
    body: |
      The question stays the same at a different scale: what does structure
      tell us about function, and how much does the answer change when the
      data is a whole-brain scan rather than a wiring diagram? That is the
      subject of the human fMRI work described below.

