intro: |
  Shrimp farming supports a great many livelihoods in Thailand, and its largest
  risk is disease. Keeping farmed shrimp healthy is a scientific problem, but
  every answer to it eventually becomes a decision made at the edge of a pond:
  what to feed, what to treat, when to harvest. That is why this area interests
  me. It is where biological mechanism, farming economics, and community
  concerns about antibiotics meet.

steps:
  - key: question
    title: The question
    body: |
      When a disease outbreak starts in a pond, a farmer has to decide quickly.
      Antibiotics are a tempting answer, and their overuse is one of the ways
      antimicrobial resistance develops and spreads, in aquaculture and beyond
      it. Two questions follow. First, what actually keeps shrimp resilient, so
      that treatment after the fact is needed less often? Second, how do we
      know whether the antimicrobials that are used are being used well?

      The first question is the subject of the published nutrition studies
      below. The second is the direction of my current, unpublished work on
      antimicrobial resistance.
  - key: approach
    title: Approach
    body: |
      I have worked with the Faculty of Fisheries at Kasetsart University on
      aquaculture health research, including feeding trials that test whether a
      specific dietary ingredient improves growth, immune response, or survival
      in farmed shrimp. The published studies I have co-authored examine
      chestnut wood polyphenols, dietary yeast nucleic acids and free
      nucleotides, and spray-dried porcine plasma. Each asks a version of the
      same question: can a change in nutrition make shrimp more resilient?

      My antimicrobial-resistance work is separate from these studies. It is in
      progress, and I describe it here as a direction rather than a result.
  - key: contribution
    title: My contribution
    body: |
      I am a co-author on the three peer-reviewed studies listed below, as a
      student member of a research group led by faculty at Kasetsart
      University. The trials and analyses were collaborative work, and the
      published records give the full author lists.

      My current work on antibiotics and antimicrobial resistance is ongoing
      and not yet published.
  - key: evidence
    title: Evidence and status
    body: |
      - Three peer-reviewed publications, 2025 to 2026, with co-author
        attribution (see below).
      - Antimicrobial-resistance research: in progress. No manuscript is
        published or under review at the time of writing, and I will update
        this page only when that changes.
  - key: next
    title: The next question
    body: |
      If better nutrition and management reduce the need for treatment, what
      determines whether a farmer adopts them? That question is not answered in
      a laboratory. It is the reason I built [ShrimpPulse](/work/shrimppulse).

