# Ideas & Expression: history and philosophy
title: History and philosophy
lede: Institutions, interpretation, and what we should value
order: 2
published: true
body: |
  History and philosophy are where I practise questioning assumptions. History
  trains the habit of asking how institutions came to be, what their decisions
  caused, and how we can know. Philosophy trains the habit of saying exactly
  what a claim means, and then checking whether it holds.

  I have represented Thailand at the International Philosophy Olympiad in 2025
  and 2026, receiving an honourable mention in 2025. At the International
  History Olympiad in 2025 I placed first in the written exam and placed in
  several subject categories. I also compete in History Bee and Bowl.

  What I take from both is less a set of facts than a set of questions to ask
  of any system, including the ones I study scientifically: who set it up this
  way, what does it reward, and what should it be for?
