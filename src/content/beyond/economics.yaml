# Beyond the Lab: economics
title: Economics
lede: Incentives, trade-offs, and policy
order: 1
published: true
body: |
  Economics is the discipline that most directly asks my central question:
  given how a system is set up, what will people do? I compete in the Thailand
  Economics Olympiad and the International Economics Olympiad, and I took part
  in the IEOx Essay Challenge in 2026.

  Lately I have been reading about climate economics, especially carbon-border
  policy. When a large economy taxes the carbon embedded in its imports, what
  happens to exporters like Thailand, who adjusts, and who ultimately pays? It
  is a question about incentives and institutions at once, and it connects to
  the practical side of my research: a useful technology still has to survive
  the incentives around it.
