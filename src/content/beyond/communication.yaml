# Ideas & Expression: communication and participation
title: Communication and participation
lede: Public speaking, debate, and representing others
order: 4
published: true
body: |
  Explaining something clearly is part of understanding it, and most of what I
  work on only matters if it can be explained to someone outside the field. I
  speak in public when I can, compete in formats that reward quick and careful
  argument, and take on responsibilities that involve speaking for other
  people.
