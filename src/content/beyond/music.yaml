# Beyond the Lab: music
title: Music
lede: Classical guitar and clarinet
order: 3
published: true
body: |
  I play classical guitar and clarinet, and have studied both for many years. I
  have completed Trinity Grade 8 in classical guitar and ABRSM Grade 6 in
  clarinet. Practising and performing are a regular part of my week.

  I keep music separate from the rest of what I do. It is not research, it is
  not preparation for anything, and I like it that way.
